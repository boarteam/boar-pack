name: Feature request
description: Suggest an improvement to one of the @boarteam/boar-pack-* packages
title: "[feat] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Target package
      options:
        - "@boarteam/boar-pack-users-backend"
        - "@boarteam/boar-pack-users-frontend"
        - "@boarteam/boar-pack-common-backend"
        - "@boarteam/boar-pack-common-frontend"
        - "@boarteam/boar-pack-liquidity-monitor-backend"
        - "@boarteam/boar-pack-liquidity-monitor-frontend"
        - repository / tooling / other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >-
        Describe the use case, not just the solution — it helps evaluate
        alternatives.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the package to do? API sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you're using today, other libraries, etc.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to implement this myself and send a pull request
